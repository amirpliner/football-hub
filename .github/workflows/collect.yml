name: Collect football news

on:
  schedule:
    # 4 פעמים ביום (שעון UTC): בערך 07:15, 13:15, 19:15, 00:15 בישראל
    - cron: "15 4,10,16,21 * * *"
  workflow_dispatch: {}   # כפתור "Run workflow" להרצה ידנית

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run collector
        run: python3 scripts/collect.py
      - name: Collect matches and tables
        run: python3 scripts/collect_matches.py
        continue-on-error: true   # ESPN לא רשמי: כשל שם לא יפיל את איסוף הכתבות
      - name: Claude layer (summaries, previews, analysis)
        # מושבת עד ש-ai.enabled=true בקובץ ההגדרות ויש סוד ANTHROPIC_API_KEY
        run: |
          pip install --quiet anthropic
          python3 scripts/ai_layer.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated data
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
