<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#060b2e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מגרש">
  <title>מגרש – טקטיקה וניתוח</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="matches">
  <header class="top">
    <div class="wrap">
      <div class="brand-row">
        <h1>מגרש</h1>
        <div class="tools">
          <button id="btn-refresh" class="icon-only" title="רענן נתונים" aria-label="רענן נתונים"><span data-icon="refresh"></span></button>
          <button id="btn-theme" class="icon-only" title="מצב כהה / בהיר" aria-label="החלף מצב כהה/בהיר"><span data-icon="moon"></span></button>
        </div>
      </div>

      <nav class="views" id="views" aria-label="תצוגה">
        <button data-view="analysis">ניתוחים</button>
        <button data-view="concepts">מושגים</button>
        <button data-view="reads">מאמרים</button>
        <button data-view="matches" class="on">משחקים</button>
        <button data-view="tables">טבלאות</button>
      </nav>
    </div>
  </header>

  <div class="pages-bar" id="pages-bar">
    <div class="wrap">
      <div class="chips" id="league-chips" role="tablist" aria-label="ליגה"></div>
    </div>
  </div>

  <main class="wrap">
    <p class="status" id="status" role="status">טוען…</p>
    <div id="list"></div>
    <button id="more" class="more" hidden>הצג עוד</button>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
